{% extends "base.html" %}
{% block titulo %}Editar Profissional - SISGERSA{% endblock %}
{% block conteudo %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h4><i class="bi bi-person-badge"></i> Editar Profissional</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="/profissionais/{{ prof.id }}/editar" enctype="multipart/form-data">
                    <input type="hidden" name="foto_url" id="prof-foto-url" value="{{ prof.foto_url or '' }}">
                    <div class="text-center mb-4">
                        <div id="prof-foto-preview" class="d-inline-flex align-items-center justify-content-center bg-light rounded-circle" style="width:120px;height:120px;border:2px dashed #ccc;cursor:pointer;overflow:hidden;" onclick="document.getElementById('prof-foto-input').click()">
                            {% if prof.foto_url %}
                            <img src="{{ prof.foto_url }}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">
                            {% else %}
                            <i class="bi bi-person text-muted" style="font-size:3rem;"></i>
                            {% endif %}
                        </div>
                        <div class="mt-2">
                            <button type="button" class="btn btn-sm btn-outline-primary" onclick="document.getElementById('prof-foto-input').click()">
                                <i class="bi bi-upload"></i> Escolher Foto
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="abrirCamera('prof')">
                                <i class="bi bi-camera"></i> Tirar Foto
                            </button>
                            <input type="file" id="prof-foto-input" accept="image/*" class="d-none" onchange="previewImagem(this, 'prof-foto-preview', 'prof-foto-url')">
                            <input type="file" id="prof-camera-input" accept="image/*" capture="user" class="d-none" onchange="previewImagem(this, 'prof-foto-preview', 'prof-foto-url')">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Nome Completo *</label>
                            <input type="text" class="form-control" name="nome" value="{{ prof.nome }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Email *</label>
                            <input type="email" class="form-control" name="email" value="{{ prof.email }}" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Telefone</label>
                            <input type="text" class="form-control" name="telefone" value="{{ prof.telefone or '' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Especialidade</label>
                            <input type="text" class="form-control" name="especialidade" value="{{ prof.especialidade or '' }}">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Cargo</label>
                            <select class="form-select" name="cargo">
                                <option value="">Selecione...</option>
                                {% set cargos = ['dentista','medico','enfermeiro','admin','recepcionista','auxiliar'] %}
                                {% for c in cargos %}
                                <option value="{{ c }}" {% if prof.cargo == c %}selected{% endif %}>{{ c|title }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Registro Profissional</label>
                            <input type="text" class="form-control" name="registro_profissional" value="{{ prof.registro_profissional or '' }}">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Estabelecimento</label>
                        <select class="form-select" name="estabelecimento_id">
                            <option value="">Nenhum</option>
                            {% for e in estabelecimentos %}
                            <option value="{{ e.id }}" {% if prof.estabelecimento_id == e.id %}selected{% endif %}>{{ e.nome }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Cor do Profissional (agenda)</label>
                        <div class="d-flex align-items-center gap-2">
                            <input type="color" class="form-control form-control-color" name="cor" value="{{ prof.cor or '#6c757d' }}">
                            <small class="text-muted">Identifica os agendamentos na agenda</small>
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <a href="/profissionais" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Voltar
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i> Salvar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
