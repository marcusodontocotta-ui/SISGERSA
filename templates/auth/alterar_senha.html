{% extends "base.html" %}
{% block titulo %}Alterar Senha - SISGERSA{% endblock %}
{% block conteudo %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h4 class="mb-1"><i class="bi bi-shield-lock"></i> Alterar Senha</h4>
                <p class="text-muted mb-4">Defina uma nova senha para a sua conta.</p>

                {% if erro %}
                <div class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle"></i> {{ erro }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                {% endif %}

                {% if sucesso %}
                <div class="alert alert-success" role="alert">
                    <i class="bi bi-check-circle"></i> {{ sucesso }}
                </div>
                {% else %}
                <form method="POST" action="/minha-conta/alterar-senha" id="formAlterarSenha">
                    <div class="mb-3">
                        <label for="senha_atual" class="form-label">Senha atual</label>
                        <input type="password" class="form-control" id="senha_atual" name="senha_atual" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="nova_senha" class="form-label">Nova senha</label>
                        <input type="password" class="form-control" id="nova_senha" name="nova_senha" minlength="6" required>
                        <div class="form-text">Mínimo de 6 caracteres.</div>
                    </div>
                    <div class="mb-4">
                        <label for="nova_senha2" class="form-label">Confirmar nova senha</label>
                        <input type="password" class="form-control" id="nova_senha2" name="nova_senha2" minlength="6" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle"></i> Salvar nova senha
                        </button>
                    </div>
                </form>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
