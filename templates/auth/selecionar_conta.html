<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selecionar Conta - SISGERSA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/static/css/custom.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <i class="bi bi-hospital text-primary" style="font-size: 3rem;"></i>
                            <h3 class="mt-2 fw-bold">SISGERSA</h3>
                            <p class="text-muted">Mais de uma conta encontrada com este email.<br>Selecione qual conta deseja acessar:</p>
                        </div>

                        {% for u in usuarios %}
                        <form method="POST" action="/login/selecionar" class="mb-3">
                            <input type="hidden" name="session_key" value="{{ session_key }}">
                            <input type="hidden" name="usuario_id" value="{{ u.id }}">
                            <button type="submit" class="btn btn-outline-primary w-100 text-start py-3 px-3 shadow-sm border-2">
                                <div class="d-flex align-items-center">
                                    <div class="me-3">
                                        {% if u.tipo == 'admin' %}
                                        <i class="bi bi-shield-lock text-danger fs-3"></i>
                                        {% elif u.tipo == 'profissional' %}
                                        <i class="bi bi-person-badge text-info fs-3"></i>
                                        {% elif u.tipo == 'recepcionista' %}
                                        <i class="bi bi-headset text-warning fs-3"></i>
                                        {% else %}
                                        <i class="bi bi-person text-success fs-3"></i>
                                        {% endif %}
                                    </div>
                                    <div>
                                        <div class="fw-bold fs-5">{{ u.nome }}</div>
                                        <div>
                                            <span class="badge bg-secondary">{{ u.tipo|capitalize }}</span>
                                            {% if u.estabelecimentos %}
                                            <small class="text-muted ms-2">
                                                {% for e in u.estabelecimentos %}{{ e.nome }}{% if not loop.last %}, {% endif %}{% endfor %}
                                            </small>
                                            {% endif %}
                                        </div>
                                    </div>
                                    <div class="ms-auto">
                                        <i class="bi bi-box-arrow-in-right text-primary fs-5"></i>
                                    </div>
                                </div>
                            </button>
                        </form>
                        {% endfor %}

                        <hr class="my-4">
                        <p class="text-center text-muted mb-0">
                            <a href="/login"><i class="bi bi-arrow-left"></i> Voltar ao login</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
