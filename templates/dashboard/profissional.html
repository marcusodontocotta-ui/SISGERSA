{% extends "base.html" %}
{% block titulo %}Painel do Profissional{% endblock %}
{% block conteudo %}
<div class="row mb-4">
    <div class="col">
        <h2><i class="bi bi-person-badge"></i> Painel do Profissional</h2>
        <p class="text-muted">Bem-vindo, {{ usuario.nome }}</p>
    </div>
</div>

<div class="row g-4">
    <div class="col-md-4">
        <div class="card text-bg-primary">
            <div class="card-body">
                <div class="d-flex justify-content-between">
                    <div>
                        <h6 class="card-title">Meus Prontuarios</h6>
                        <h2>-</h2>
                    </div>
                    <i class="bi bi-people fs-1 opacity-50"></i>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-bg-success">
            <div class="card-body">
                <div class="d-flex justify-content-between">
                    <div>
                        <h6 class="card-title">Consultas Hoje</h6>
                        <h2>-</h2>
                    </div>
                    <i class="bi bi-calendar-check fs-1 opacity-50"></i>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-bg-warning">
            <div class="card-body">
                <div class="d-flex justify-content-between">
                    <div>
                        <h6 class="card-title">Pendentes</h6>
                        <h2>-</h2>
                    </div>
                    <i class="bi bi-clock-history fs-1 opacity-50"></i>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="row mt-4">
    <div class="col-12">
        <div class="card">
            <div class="card-header">
                <h5><i class="bi bi-calendar3"></i> Proximas Consultas</h5>
            </div>
            <div class="card-body">
                <p class="text-muted">Nenhuma consulta agendada.</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
