{% extends "base.html" %}
{% block titulo %}Painel - Recepcionista{% endblock %}
{% block conteudo %}
<div class="row mb-4">
    <div class="col">
        <h2><i class="bi bi-headset"></i> Painel - Recepcionista</h2>
        <p class="text-muted">Bem-vindo, {{ usuario.nome }}</p>
    </div>
</div>

<div class="row g-4">
    <div class="col-md-4">
        <div class="card text-bg-info">
            <div class="card-body">
                <div class="d-flex justify-content-between">
                    <div>
                        <h6 class="card-title">Prontuarios Cadastrados</h6>
                        <h2>-</h2>
                    </div>
                    <i class="bi bi-people fs-1 opacity-50"></i>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-bg-success">
            <div class="card-body">
                <div class="d-flex justify-content-between">
                    <div>
                        <h6 class="card-title">Consultas Hoje</h6>
                        <h2>-</h2>
                    </div>
                    <i class="bi bi-calendar-check fs-1 opacity-50"></i>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-bg-warning">
            <div class="card-body">
                <div class="d-flex justify-content-between">
                    <div>
                        <h6 class="card-title">Aguardando</h6>
                        <h2>-</h2>
                    </div>
                    <i class="bi bi-hourglass-split fs-1 opacity-50"></i>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="row mt-4">
    <div class="col-12">
        <a href="/pacientes" class="btn btn-primary me-2">
            <i class="bi bi-person-plus"></i> Cadastrar Paciente
        </a>
        <a href="/consultas" class="btn btn-success">
            <i class="bi bi-calendar-plus"></i> Agendar Consulta
        </a>
    </div>
</div>
{% endblock %}
