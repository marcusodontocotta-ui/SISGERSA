{% extends "base.html" %}
{% block titulo %}{{ 'Editar' if convenio else 'Novo' }} Convenio{% endblock %}
{% block conteudo %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h5><i class="bi bi-shield-check"></i> {{ 'Editar' if convenio else 'Novo' }} Convenio</h5>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ '/convenios/' ~ convenio.id ~ '/editar' if convenio else '/convenios/criar' }}">
                    <div class="mb-3">
                        <label class="form-label">Nome *</label>
                        <input type="text" class="form-control" name="nome" value="{{ convenio.nome if convenio else '' }}" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">CNPJ</label>
                            <input type="text" class="form-control" name="cnpj" value="{{ convenio.cnpj if convenio and convenio.cnpj else '' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Telefone</label>
                            <input type="text" class="form-control" name="telefone" value="{{ convenio.telefone if convenio and convenio.telefone else '' }}">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" name="email" value="{{ convenio.email if convenio and convenio.email else '' }}">
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i> Salvar
                        </button>
                        <a href="/convenios" class="btn btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
