{% extends "base.html" %}
{% block titulo %}{{ 'Editar' if procedimento else 'Novo' }} Procedimento{% endblock %}
{% block conteudo %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h5><i class="bi bi-clipboard2-pulse"></i> {{ 'Editar' if procedimento else 'Novo' }} Procedimento</h5>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ '/procedimentos/' ~ procedimento.id ~ '/editar' if procedimento else '/procedimentos/criar' }}">
                    <div class="mb-3">
                        <label class="form-label">Nome *</label>
                        <input type="text" class="form-control" name="nome" value="{{ procedimento.nome if procedimento else '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Descricao</label>
                        <textarea class="form-control" name="descricao" rows="3">{{ procedimento.descricao if procedimento and procedimento.descricao else '' }}</textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Duracao Padrao (minutos) *</label>
                        <input type="number" class="form-control" name="duracao_minutos"
                               value="{{ procedimento.duracao_minutos if procedimento else 30 }}" min="5" max="480" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Categoria</label>
                            <select class="form-select" name="categoria">
                                <option value="">Selecione...</option>
                                {% set cats = ['limpeza','restauracao','endodontia','periodontia','cirurgia','protese','ortodontia','implante','profilaxia','radiologia','cirurgia_buco_maxilo','odontopediatria','estetica','outro'] %}
                                {% for c in cats %}
                                <option value="{{ c }}" {% if procedimento and procedimento.categoria == c %}selected{% endif %}>{{ c|replace('_',' ')|title }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Codigo TUSS</label>
                            <input type="text" class="form-control" name="codigo_tuss" value="{{ procedimento.codigo_tuss if procedimento and procedimento.codigo_tuss else '' }}">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Codigo Americano</label>
                            <input type="text" class="form-control" name="codigo_americano" value="{{ procedimento.codigo_americano if procedimento and procedimento.codigo_americano else '' }}">
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i> Salvar
                        </button>
                        <a href="/procedimentos" class="btn btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
