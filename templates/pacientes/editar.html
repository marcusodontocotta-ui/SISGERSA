{% extends "base.html" %}
{% block titulo %}Editar Prontuario{% endblock %}
{% block conteudo %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h4><i class="bi bi-person"></i> Editar Prontuario</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="/pacientes/{{ pac.id }}/editar" enctype="multipart/form-data">
                    <input type="hidden" name="foto_url" id="pac-foto-url" value="{{ pac.foto_url or '' }}">
                    <div class="text-center mb-3">
                        <div id="pac-foto-preview" class="d-inline-flex align-items-center justify-content-center bg-light rounded-circle" style="width:120px;height:120px;border:2px dashed #ccc;cursor:pointer;overflow:hidden;" onclick="document.getElementById('pac-foto-input').click()">
                            {% if pac.foto_url %}
                            <img src="{{ pac.foto_url }}" style="width:100%;height:100%;object-fit:cover;">
                            {% else %}
                            <i class="bi bi-person text-muted" style="font-size:3rem;"></i>
                            {% endif %}
                        </div>
                        <div class="mt-2">
                            <button type="button" class="btn btn-sm btn-outline-primary" onclick="document.getElementById('pac-foto-input').click()">
                                <i class="bi bi-upload"></i> Escolher Foto
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="abrirCamera('pac')">
                                <i class="bi bi-camera"></i> Tirar Foto
                            </button>
                            <input type="file" id="pac-foto-input" accept="image/*" class="d-none" onchange="previewImagem(this, 'pac-foto-preview', 'pac-foto-url')">
                            <input type="file" id="pac-camera-input" accept="image/*" capture="user" class="d-none" onchange="previewImagem(this, 'pac-foto-preview', 'pac-foto-url')">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nome Completo *</label>
                        <input type="text" class="form-control" name="nome" value="{{ pac.nome }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email *</label>
                        <input type="email" class="form-control" name="email" value="{{ pac.email }}" required>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Codigo do Paciente</label>
                            <input type="text" class="form-control" name="codigo_paciente" value="{{ pac.codigo_paciente or '' }}" placeholder="Ex: 841">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">CPF</label>
                            <input type="text" class="form-control" name="cpf" value="{{ pac.cpf or '' }}" data-mask="cpf" placeholder="000.000.000-00">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Telefone</label>
                            <input type="text" class="form-control" name="telefone" value="{{ pac.telefone or '' }}" data-mask="phone">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Data de Nascimento</label>
                            <input type="date" class="form-control" name="data_nascimento" value="{{ pac.data_nascimento.strftime('%Y-%m-%d') if pac.data_nascimento else '' }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Estado Civil</label>
                            <select class="form-select" name="estado_civil">
                                <option value="">Selecione...</option>
                                <option value="Solteiro(a)" {{ 'selected' if pac.estado_civil == 'Solteiro(a)' }}>Solteiro(a)</option>
                                <option value="Casado(a)" {{ 'selected' if pac.estado_civil == 'Casado(a)' }}>Casado(a)</option>
                                <option value="Divorciado(a)" {{ 'selected' if pac.estado_civil == 'Divorciado(a)' }}>Divorciado(a)</option>
                                <option value="Viuvo(a)" {{ 'selected' if pac.estado_civil == 'Viuvo(a)' }}>Viuvo(a)</option>
                                <option value="Uniao Estavel" {{ 'selected' if pac.estado_civil == 'Uniao Estavel' }}>Uniao Estavel</option>
                                <option value="Disquitado(a)" {{ 'selected' if pac.estado_civil == 'Disquitado(a)' }}>Disquitado(a)</option>
                                <option value="Outro" {{ 'selected' if pac.estado_civil == 'Outro' }}>Outro</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Profissao</label>
                            <input type="text" class="form-control" name="profissao" value="{{ pac.profissao or '' }}">
                        </div>
                    </div>
                    <div class="card-header" style="background:#1a1a2e;color:#fff;margin-top:10px;">
                        <h6 class="mb-0"><i class="bi bi-geo-alt"></i> Endereco</h6>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">CEP</label>
                            <input type="text" class="form-control" name="cep" id="pac-cep" value="{{ pac.cep or '' }}" maxlength="9" placeholder="00000-000" onblur="buscarCEP(this.value, 'pac')">
                        </div>
                        <div class="col-md-8 mb-3">
                            <label class="form-label">Logradouro</label>
                            <input type="text" class="form-control" name="logradouro" id="pac-logradouro" value="{{ pac.logradouro or '' }}" placeholder="Rua, Avenida, etc.">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Numero</label>
                            <input type="text" class="form-control" name="numero" id="pac-numero" value="{{ pac.numero or '' }}">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Complemento</label>
                            <input type="text" class="form-control" name="complemento" id="pac-complemento" value="{{ pac.complemento or '' }}" placeholder="Apto, Bloco, etc.">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Bairro</label>
                            <input type="text" class="form-control" name="bairro" id="pac-bairro" value="{{ pac.bairro or '' }}">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Estado (UF)</label>
                            <select class="form-select" name="estado" id="pac-estado">
                                <option value="">UF</option>
                                {% for uf in ['AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','MG','PA','PB','PR','PE','PI','RJ','RN','RS','RO','RR','SC','SP','SE','TO'] %}
                                <option value="{{ uf }}" {{ 'selected' if pac.estado == uf }}>{{ uf }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Cidade</label>
                        <input type="text" class="form-control" name="cidade" id="pac-cidade" value="{{ pac.cidade or '' }}">
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Nome do Pai</label>
                            <input type="text" class="form-control" name="nome_pai" value="{{ pac.nome_pai or '' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Nome da Mae</label>
                            <input type="text" class="form-control" name="nome_mae" value="{{ pac.nome_mae or '' }}">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Indicacao</label>
                            <input type="text" class="form-control" name="indicacao" value="{{ pac.indicacao or '' }}" placeholder="Quem indicou?">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">N. Documentacao</label>
                            <input type="text" class="form-control" name="numero_documentacao" value="{{ pac.numero_documentacao or '' }}">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Tipo</label>
                        <input type="text" class="form-control" value="{{ pac.tipo }}" disabled>
                        <small class="text-muted">Tipo de usuario nao pode ser alterado aqui.</small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Status</label>
                        <input type="text" class="form-control"
                               value="{{ 'Ativo' if pac.ativo else 'Inativo' }}" disabled>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Alterar Senha</label>
                        <input type="password" class="form-control" name="senha" placeholder="Deixe em branco para manter a atual">
                        <small class="text-muted">Preencha apenas se desejar alterar a senha do paciente.</small>
                    </div>
                    <div class="d-flex gap-2">
                        <a href="/pacientes/{{ pac.id }}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Voltar
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i> Salvar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<script>
function buscarCEP(cep, prefix) {
    var c = cep.replace(/\D/g, '');
    if (c.length !== 8) return;
    fetch('/api/cep/' + c)
    .then(function(r) { return r.json(); })
    .then(function(d) {
        if (d.erro) return;
        document.getElementById(prefix + '-logradouro').value = d.logradouro || '';
        document.getElementById(prefix + '-bairro').value = d.bairro || '';
        document.getElementById(prefix + '-cidade').value = d.cidade || '';
        document.getElementById(prefix + '-estado').value = d.estado || '';
        document.getElementById(prefix + '-numero').focus();
    })
    .catch(function() {});
}
</script>
{% endblock %}
