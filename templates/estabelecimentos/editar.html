{% extends "base.html" %}
{% block titulo %}Editar Estabelecimento{% endblock %}
{% block conteudo %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h4><i class="bi bi-building"></i> Editar Estabelecimento</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="/estabelecimentos/{{ estab.id }}/editar" enctype="multipart/form-data">
                    <input type="hidden" name="logo_url" id="estab-logo-url" value="{{ estab.logo_url or '' }}">
                    <div class="text-center mb-3">
                        <div id="estab-logo-preview" class="d-inline-flex align-items-center justify-content-center bg-light rounded" style="width:120px;height:120px;border:2px dashed #ccc;cursor:pointer;" onclick="document.getElementById('estab-logo-input').click()">
                            {% if estab.logo_url %}
                            <img src="{{ estab.logo_url }}" style="width:100%;height:100%;object-fit:cover;border-radius:8px;">
                            {% else %}
                            <i class="bi bi-image text-muted" style="font-size:2rem;"></i>
                            {% endif %}
                        </div>
                        <div class="mt-2">
                            <button type="button" class="btn btn-sm btn-outline-primary" onclick="document.getElementById('estab-logo-input').click()">
                                <i class="bi bi-upload"></i> Escolher Logo
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="abrirCamera('estab')">
                                <i class="bi bi-camera"></i> Tirar Foto
                            </button>
                            <input type="file" id="estab-logo-input" accept="image/*" class="d-none" onchange="previewImagem(this, 'estab-logo-preview', 'estab-logo-url')">
                            <input type="file" id="estab-camera-input" accept="image/*" capture="environment" class="d-none" onchange="previewImagem(this, 'estab-logo-preview', 'estab-logo-url')">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nome *</label>
                        <input type="text" class="form-control" name="nome" value="{{ estab.nome }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Tipo</label>
                        <select class="form-select" name="tipo">
                            <option value="consultorio" {% if estab.tipo == 'consultorio' %}selected{% endif %}>Consultorio</option>
                            <option value="clinica" {% if estab.tipo == 'clinica' %}selected{% endif %}>Clinica</option>
                            <option value="hospital" {% if estab.tipo == 'hospital' %}selected{% endif %}>Hospital</option>
                            <option value="laboratorio" {% if estab.tipo == 'laboratorio' %}selected{% endif %}>Laboratorio</option>
                            <option value="outro" {% if estab.tipo == 'outro' %}selected{% endif %}>Outro</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">CNPJ</label>
                        <input type="text" class="form-control" name="cnpj" value="{{ estab.cnpj or '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Telefone</label>
                        <input type="text" class="form-control" name="telefone" value="{{ estab.telefone or '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" name="email" value="{{ estab.email or '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Endereco</label>
                        <textarea class="form-control" name="endereco" rows="2">{{ estab.endereco or '' }}</textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Responsavel (Profissional)</label>
                        <select class="form-select" name="responsavel_usuario_id">
                            <option value="">Nenhum</option>
                            {% for p in profissionais %}
                            <option value="{{ p.id }}" {% if estab.responsavel_usuario_id == p.id %}selected{% endif %}>{{ p.nome }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="d-flex gap-2">
                        <a href="/estabelecimentos" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Voltar
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i> Salvar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
