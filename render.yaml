services:
  - type: web
    name: sisgersa
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker
    envVars:
      - key: DB_ENGINE
        value: postgresql
      - key: DATABASE_URL
        fromDatabase:
          name: sisgersa-db
          property: connectionString
      # Pool de conexoes por worker. 4 workers x 5 = ate 20 conexoes;
      # o Postgres do Render (free) aceita ~100, entao ha folga.
      - key: DB_MAX_CONNECTIONS
        value: "5"
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.13"

databases:
  - name: sisgersa-db
    plan: free
    databaseName: sisgersa
    user: sisgersa
